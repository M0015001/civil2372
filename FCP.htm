<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未來氣候推估</title>
    <style>
        /* 基礎樣式 */
        body {
            font-family: '微軟正黑體', 'Arial', sans-serif;
            line-height: 1.7;
            margin: 0;
            padding: 40px 20px;
            background-color: #f4ffec; /* Light green background */
            color: #333;
        }
        .container {
            background: white;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            max-width: 900px;
            margin: auto;
        }
        
        /* 標題樣式 */
        h1 {
            color: #1a5e1f; /* Dark green */
            border-bottom: 4px solid #6aa84f; /* Green separator */
            padding-bottom: 15px;
            text-align: center;
            font-size: 3.3em;
            margin-top: 0;
            letter-spacing: 1px;
        }
        
        /* 次標題樣式 */
        h2 {
            color: #1a5e1f; /* Dark green */
            border-bottom: 2px solid #c6e0b4;
            padding-bottom: 8px;
            margin-top: 35px;
            margin-bottom: 25px;
            font-size: 2.5em;
        }
        
        /* 三級標題樣式 */
        h3 {
            color: #6aa84f; /* Medium green */
            margin-top: 25px;
            font-size: 1.8em;
            padding-bottom: 5px;
        }
        
        /* 內文段落 */
        p {
            margin-top: 8px;
            font-size: 1.25em;
            color: #444;
            margin-bottom: 15px;
        }

        /* 備註樣式 */
        .note {
            font-size: 1.15em;
            color: #333;
            margin-top: 15px;
            padding: 10px;
            border-left: 4px solid #6aa84f; /* Green line */
            background-color: #e6ffe6;
            border-radius: 4px;
        }
        
        /* 圖片佔位符樣式 */
        .image-placeholder {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border: 1px dashed #6aa84f;
            background-color: #f9fdf9;
            font-style: italic;
            color: #666;
        }
		
		img {
			width: 100%;
			margin-left: auto;
			margin-right: auto;
		}

    </style>
</head>
<body>

<div class="container">
    <h1>未來氣候推估</h1>

    <h2>2015-2100年</h2>

    <h3>年平均溫度</h3>
    <p>■ 與基期(1995-2014)相比，在不同全球暖化程度下，推估苗栗縣年平均溫度的變化</p>

    <div class="image-placeholder">
        <img src="images/FCP_01.webp" alt="年平均溫度01" />
		<img src="images/FCP_02.webp" alt="年平均溫度02" />
    </div>

    <hr>

    <h3>年降雨量</h3>
    <p>■ 與基期(1995-2014)相比，在不同全球暖化程度下，推估苗栗縣年降雨量的變化</p>
	
    <div class="image-placeholder">
        <img src="images/FCP_03.webp" alt="年降雨量01" />
		<img src="images/FCP_04.webp" alt="年降雨量02" />
    </div>

    <div class="note">
        資料來源：『縣市氣候變遷概述2024』，國科會「臺灣氣候變遷推估資訊與調適知識平台計畫(TCCIP)」
    </div>

</div>

</body>
</html>
